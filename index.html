<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b24">
<title>Carte de visite</title>
<link rel="icon" href="data:,">
<style>:root{--accent:#8b5cf6;--a1:#ec4899;--a3:#22d3ee;--glow:rgba(139,92,246,.55);--ink:#f3f5ff;--muted:#b7c0e6;--line:rgba(255,255,255,.18);--radius:16px}
@supports (color:color-mix(in srgb,red,blue)){:root{--a1:color-mix(in srgb,var(--accent) 40%,#ff5fb0);--a3:color-mix(in srgb,var(--accent) 40%,#22d3ee);--glow:color-mix(in srgb,var(--accent) 55%,transparent)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#05071a;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow-x:hidden}
body{min-height:100vh;min-height:100dvh;display:flex;justify-content:center}
.app{width:100%;max-width:440px;min-height:100vh;position:relative;z-index:1;padding-bottom:env(safe-area-inset-bottom);overflow-x:clip}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer}
a{color:inherit}
/* ---- fond spatial ---- */
.space{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:linear-gradient(180deg,#04061a 0%,#0a1038 52%,#120a30 100%)}
.neb{position:absolute;inset:-10%;background:
 radial-gradient(48% 36% at 82% 14%,rgba(236,72,153,.38),transparent 70%),
 radial-gradient(55% 40% at 14% 52%,rgba(124,58,237,.34),transparent 70%),
 radial-gradient(50% 36% at 88% 78%,rgba(34,211,238,.26),transparent 70%),
 radial-gradient(45% 30% at 20% 92%,rgba(16,185,129,.24),transparent 70%),
 radial-gradient(40% 28% at 50% 34%,rgba(59,130,246,.16),transparent 70%);animation:neb 38s ease-in-out infinite alternate;will-change:transform}
.sunglow{position:absolute;left:-210px;top:7%;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(255,196,92,.55) 0%,rgba(255,122,24,.32) 28%,rgba(255,90,0,.12) 52%,transparent 70%);animation:pulse 7s ease-in-out infinite}
#stars{position:absolute;inset:0;width:100%;height:100%}
.comet{position:absolute;top:16%;left:-30%;width:150px;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,rgba(76,170,255,.85) 70%,#fff);box-shadow:0 0 12px 1px rgba(76,195,255,.7);opacity:0;animation:comet 17s linear 3s infinite}
.comet::after{content:"";position:absolute;right:-3px;top:-3px;width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 14px 4px rgba(120,200,255,.9)}
@keyframes neb{from{transform:translate3d(-1.5%,0,0) scale(1)}to{transform:translate3d(1.5%,-1%,0) scale(1.07)}}
@keyframes pulse{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
@keyframes comet{0%{opacity:0;transform:translate(0,0) rotate(25deg)}2%{opacity:1}9%{opacity:1}11%{opacity:0;transform:translate(560px,261px) rotate(25deg)}100%{opacity:0;transform:translate(560px,261px) rotate(25deg)}}
@keyframes float{0%,100%{transform:translateY(-3px)}50%{transform:translateY(4px)}}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---- carte ---- */
.hero{height:104px;position:relative;margin-top:6px}
.hero svg{display:block;width:100%;height:100%;overflow:visible}
.hero svg{transform:translate3d(var(--px,0px),var(--py,0px),0);transition:transform .35s ease-out;will-change:transform}
.hero .pl{animation:drift var(--d,7s) ease-in-out var(--l,0s) infinite alternate;transform-box:fill-box;transform-origin:center;will-change:transform}
.hero .p1{--dx:3px;--dy:6px;--d:5s;--l:-1s}.hero .p2{--dx:3.5px;--dy:8px;--d:6.5s;--l:-3s}.hero .p3{--dx:3px;--dy:9px;--d:7.5s;--l:-2s}
.hero .p4{--dx:4px;--dy:7px;--d:5.5s;--l:-4s}.hero .p5{--dx:3px;--dy:10px;--d:9s;--l:-5s}.hero .p6{--dx:3.5px;--dy:8px;--d:8s;--l:-1.5s}
.hero .tilt{animation:tilt 12s ease-in-out -3s infinite alternate;transform-box:fill-box;transform-origin:center;will-change:transform}
.hero .sun{animation:sunpulse 5.5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center;will-change:transform,opacity}
@keyframes drift{from{transform:translate(calc(var(--dx)/-2),calc(var(--dy)/-2))}to{transform:translate(calc(var(--dx)/2),calc(var(--dy)/2))}}
@keyframes tilt{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
@keyframes sunpulse{from{transform:scale(.95);opacity:.8}to{transform:scale(1.07);opacity:1}}
.avatar-wrap{width:134px;height:134px;border-radius:50%;margin:-6px auto -74px;position:relative;z-index:2;padding:4px;display:grid;place-items:center;background:conic-gradient(from 210deg,var(--a1),var(--accent),var(--a3),var(--a1));box-shadow:0 0 34px var(--glow)}
.avatar{width:100%;height:100%;border-radius:50%;object-fit:cover;background:linear-gradient(145deg,#1b1456,#0b1e4a);color:#fff;display:grid;place-items:center;font-size:42px;font-weight:700;overflow:hidden}
.glass{margin:0 14px;padding:84px 0 22px;border-radius:30px;background:linear-gradient(160deg,rgba(255,255,255,.15),rgba(255,255,255,.05));border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.2);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.id{text-align:center;padding:0 20px}
.name{font-size:25px;font-weight:750;margin:0;color:#fff;letter-spacing:.2px;text-shadow:0 0 18px var(--glow)}
.job{font-size:15.5px;color:var(--muted);margin:6px 0 0;font-weight:500;line-height:1.4}
.cta{display:flex;align-items:center;justify-content:center;gap:12px;width:calc(100% - 40px);margin:20px 20px 0;padding:15px;border:0;border-radius:var(--radius);background:linear-gradient(100deg,var(--a1),var(--accent) 52%,var(--a3));color:#fff;font-size:17px;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.3);box-shadow:0 6px 24px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.cta:active{transform:scale(.98)}
.cta svg{width:24px;height:24px}
.company{text-align:center;color:var(--muted);font-weight:500;font-size:15.5px;line-height:1.5;margin:20px 20px 0}
.company b{display:block;font-weight:700;color:#fff;font-size:17px}
.rows{padding:16px 20px 0;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:16px;padding:14px 16px;border-radius:var(--radius);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;text-decoration:none;font-size:15.5px;min-height:54px;overflow-wrap:anywhere}
.row:active{background:rgba(255,255,255,.16)}
.row svg{flex:none;width:22px;height:22px;color:var(--a3);filter:drop-shadow(0 0 5px var(--a3))}
.logo{display:flex;flex-direction:column;align-items:center;margin:22px 0 6px}
.logo img{width:190px;height:auto;display:block;max-width:64%;filter:drop-shadow(0 0 16px var(--glow)) drop-shadow(0 0 3px rgba(255,255,255,.25))}
.empty{color:var(--muted);text-align:center;font-size:14px;padding:6px 20px}
.actions{display:flex;gap:10px;padding:8px 14px 28px}
.btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:11px 6px;border:1px solid var(--line);border-radius:var(--radius);background:rgba(255,255,255,.08);color:#fff;font-size:13px;font-weight:600}
.btn svg{width:22px;height:22px;color:var(--a3);filter:drop-shadow(0 0 4px var(--a3))}
.btn:active{background:rgba(255,255,255,.18)}
.banner{background:#fff3c4;color:#6b5000;font-size:13px;padding:8px 14px;text-align:center}
/* ---- édition ---- */
#editView{min-height:100vh;background:linear-gradient(180deg,rgba(6,9,36,.72),rgba(10,8,34,.82))}
.edit-head{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(7,10,38,.94);border-bottom:1px solid var(--line)}
.edit-head h1{font-size:18px;margin:0;color:#fff}
.link{border:0;background:none;color:var(--muted);font-weight:600;padding:8px}
.save{border:0;background:linear-gradient(100deg,var(--a1),var(--accent),var(--a3));color:#fff;font-weight:700;padding:10px 18px;border-radius:12px;box-shadow:0 4px 16px var(--glow)}
form{padding:16px 20px 40px;display:flex;flex-direction:column;gap:14px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
label small{color:#9ea8d4}
input[type=text],input[type=email],input[type=tel],input[type=url],textarea{font:inherit;font-size:16px;padding:12px 13px;border:1.5px solid rgba(255,255,255,.2);border-radius:12px;color:#fff;background:rgba(255,255,255,.08);width:100%}
input::placeholder{color:#7f8ab8}
input:focus,textarea:focus{outline:none;border-color:var(--a3);box-shadow:0 0 0 3px rgba(34,211,238,.18)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo-edit{display:flex;align-items:center;gap:16px}
.photo-edit .avatar{width:84px;height:84px;font-size:30px;flex:none;border:2px solid var(--accent)}
.photo-edit .col{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.pill{border:1.5px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;color:#fff}
.pill.danger{color:#ff9a92}
.pill[disabled]{opacity:.5}
.colors{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.35);padding:0}
.sw.on{box-shadow:0 0 0 3px #fff,0 0 14px 2px var(--glow)}
input[type=color]{width:42px;height:34px;padding:0;border:0;background:none}
.reset{align-self:flex-start;margin-top:6px}
/* ---- feuille QR ---- */
.sheet-bg{position:fixed;inset:0;background:rgba(2,4,20,.65);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:440px;background:linear-gradient(180deg,#141a4a,#0b0f33);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));text-align:center;color:#fff}
.seg{display:grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.08);border-radius:12px;padding:4px;margin:0 0 16px}
.seg button{border:0;background:none;padding:10px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button.on{background:linear-gradient(100deg,var(--a1),var(--accent),var(--a3));color:#fff}
#qr{width:min(78vw,300px);height:min(78vw,300px);margin:0 auto;display:block;image-rendering:pixelated;background:#fff;border-radius:14px;box-shadow:0 0 28px var(--glow)}
.hint{font-size:13px;color:var(--muted);margin:12px 4px 14px;line-height:1.4}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:rgba(20,26,74,.96);border:1px solid var(--line);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;z-index:40;max-width:90vw;text-align:center}
@media(min-width:480px){body{padding:16px 0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.comet{display:none}}
</style>
</head>

<!-- ======== VUE ÉDITION ======== -->
<section id="editView" hidden>
  <div class="edit-head">
    <button class="link" id="cancelBtn" type="button">Annuler</button>
    <h1>Ma carte</h1>
    <button class="save" id="saveBtn" type="button">Enregistrer</button>
  </div>
  <form id="form" autocomplete="off" onsubmit="return false">
    <div class="photo-edit">
      <div class="avatar" id="photoPrev"></div>
      <div class="col">
        <button class="pill" type="button" id="photoBtn">Choisir une photo</button>
        <button class="pill danger" type="button" id="photoDel" hidden>Supprimer</button>
        <button class="pill" type="button" id="photoDl" hidden title="À déposer à côté du fichier hébergé : les visiteurs verront votre photo">Télécharger photo.jpg</button>
        <input type="file" id="photoFile" accept="image/*" hidden>
      </div>
    </div>
    <div class="two">
      <label>Prénom<input type="text" id="f_prenom" autocapitalize="words"></label>
      <label>Nom<input type="text" id="f_nom" autocapitalize="words"></label>
    </div>
    <label>Poste<input type="text" id="f_poste"></label>
    <label>Entreprise<input type="text" id="f_entreprise"></label>
    <label>Slogan<input type="text" id="f_slogan"></label>
    <label>Email<input type="email" id="f_email" inputmode="email" autocapitalize="none"></label>
    <label>Téléphone<input type="tel" id="f_tel" inputmode="tel" placeholder="+33 6 12 34 56 78"></label>
    <label>Site web<input type="text" id="f_web" inputmode="url" autocapitalize="none" placeholder="www.exemple.fr"></label>
    <label>LinkedIn<input type="text" id="f_linkedin" autocapitalize="none" placeholder="linkedin.com/in/votre-nom"></label>
    <label>Instagram<input type="text" id="f_instagram" autocapitalize="none" placeholder="instagram.com/votre-compte"></label>
    <label>Adresse<input type="text" id="f_adresse"></label>
    <label>Adresse publique de la carte (URL HTTPS où le fichier sera hébergé)<input type="text" id="f_publicUrl" inputmode="url" autocapitalize="none" placeholder="https://www.webcommit.fr/carte/">
      <small style="font-weight:400;line-height:1.35">Utilisée pour le QR code « Lien de la carte » et le partage : les prospects ouvrent ainsi votre carte en lecture seule.</small></label>
    <div>
      <label style="margin-bottom:8px">Couleur d'accent</label>
      <div class="colors" id="colors"></div>
    </div>
    <button class="pill danger reset" type="button" id="resetBtn">Réinitialiser la carte</button>
  </form>
</section>

    <div class="seg">

      <button type="button" id="segV">Contact direct</button>
    </div>
    <canvas id="qr" width="300" height="300"></canvas>
    <p class="hint" id="qrHint"></p>
    <div style="display:flex;gap:10px;justify-content:center">
      <button class="pill" id="qrDl" type="button" style="background:linear-gradient(100deg,var(--a1),var(--accent),var(--a3));color:#fff;border-color:transparent">Télécharger le QR</button>
      <button class="pill" id="qrClose" type="button">Fermer</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

var qrcode = function() {

  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }

      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

        setupTypeNumber(test);
      }

      if (_dataCache == null) {

      }

      mapData(_dataCache, maskPattern);

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

        if (_modules[6][c] != null) {
          continue;
        }

            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              } else {
                _modules[row + r][col + c] = false;
              }
            }

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

        var b2 = read();

      var bytes = [];

        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

/* ---------- utilitaires ---------- */
function clone(o){return JSON.parse(JSON.stringify(o))}
function b64uEnc(str){var b=new TextEncoder().encode(str),s="";for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function b64uDec(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";var bin=atob(s),b=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return new TextDecoder().decode(b)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function toast(msg){var t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(function(){t.hidden=true},2400)}
function initials(d){return ((d.prenom||"").charAt(0)+(d.nom||"").charAt(0)).toUpperCase()||"?"}
function fbase(s){return s.toLowerCase().replace(/(^|\s)\S/g,function(c){return c.toUpperCase()})}
function fullName(d){return [d.prenom,d.nom].filter(Boolean).join(" ")}
function normUrl(u){u=(u||"").trim();if(!u)return"";return /^https?:\/\//i.test(u)?u:"https://"+u.replace(/^\/+/,"")}
function normLinkedin(u){u=(u||"").trim();if(!u)return"";if(/linkedin\.com/i.test(u))return normUrl(u);return "https://www.linkedin.com/in/"+u.replace(/^@/,"")}
function normInstagram(u){u=(u||"").trim();if(!u)return"";if(/instagram\.com/i.test(u))return normUrl(u);return "https://www.instagram.com/"+u.replace(/^@/,"")}
function telClean(t){var s=(t||"").replace(/[^\d+]/g,"");if(s.indexOf("00")===0)s="+"+s.slice(2);if(/^0\d{9}$/.test(s))s="+33"+s.slice(1);return s}
function mapsUrl(a){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(a)}
function shortUrl(u){return u.replace(/^https?:\/\/(www\.)?/i,"").replace(/\/$/,"")}

/* ---------- stockage / hash ---------- */
function merge(o){var d=clone(DEFAULT);if(o&&typeof o==="object")for(var k in d)if(typeof o[k]==="string")d[k]=o[k];if(d.accent.toLowerCase()==="#0ea5e9")d.accent="#8b5cf6";return d}
function encodeHash(d,withPhoto){var o={};for(var k in d){if(k==="photo"||k==="publicUrl")continue;if(k==="thumb"&&!withPhoto)continue;if(d[k])o[k]=d[k]}return "c="+b64uEnc(JSON.stringify(o))}
function readHash(){var m=/[#&]c=([^&]+)/.exec(location.hash);if(!m)return null;try{return merge(JSON.parse(b64uDec(m[1])))}catch(e){return null}}
function readLocal(){try{var s=localStorage.getItem(KEY);return s?merge(JSON.parse(s)):null}catch(e){return null}}
function saveLocal(d){try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){toast("Stockage local indisponible (photo trop lourde ?)")}}
function baseUrl(){var u=(data.publicUrl||"").trim().replace(/#.*$/,"");if(u)return normUrl(u);return /^https?:$/.test(location.protocol)?location.href.split("#")[0]:""}
function cardUrl(withPhoto){var b=baseUrl();return b?b+"#"+encodeHash(data,withPhoto):""}

 linkedin:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 3h16a1 1 0 011 1v16a1 1 0 01-1 1H4a1 1 0 01-1-1V4a1 1 0 011-1zm2.3 7.2V18h2.4v-7.8zM7.5 6.6a1.4 1.4 0 100 2.8 1.4 1.4 0 000-2.800zM10.8 10.200V18h2.400v-4.100c0-1.100.5-1.800 1.400-1.800s1.300.7 1.300 1.700V18h2.400v-4.700c0-2.200-1.100-3.300-2.800-3.300-1.100 0-1.900.6-2.300 1.200v-1z"/></svg>',
 instagram:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none"/></svg>',
 adresse:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 22s7-6.300 7-12a7 7 0 10-14 0c0 5.700 7 12 7 12z"/><circle cx="12" cy="10" r="2.600"/></svg>'};
function avatarHtml(d,el){
  if(d.photo){el.innerHTML='<img alt="" style="width:100%;height:100%;border-radius:50%;object-fit:cover" src="'+esc(d.photo)+'">'}
  else if(d.thumb){el.innerHTML='<img alt="" style="width:100%;height:100%;border-radius:50%;object-fit:cover" src="'+esc(d.thumb)+'">'}
  else{el.textContent=initials(d);
    if(visitor&&location.protocol!=="file:"){var im=new Image();im.onload=function(){el.textContent="";el.appendChild(im);im.alt="";im.style.cssText="width:100%;height:100%;border-radius:50%;object-fit:cover"};im.src="photo.jpg"}}
}
function applyAccent(c){document.documentElement.style.setProperty("--accent",c||"#8b5cf6");}
function renderCard(){
  var d=data;applyAccent(d.accent);
  var av=$("avatar");av.className="avatar";avatarHtml(d,av);
  $("vName").textContent=fullName(d)||"Votre nom";
  $("vJob").textContent=d.poste;$("vJob").hidden=!d.poste;
  var c=$("vCompany");c.innerHTML="";c.hidden=!(d.entreprise||d.slogan);
  if(d.entreprise){var b=document.createElement("b");b.textContent=d.entreprise;c.appendChild(b)}
  if(d.slogan){var s=document.createElement("span");s.textContent=d.slogan;c.appendChild(s)}
  var rows=[];
  if(d.email)rows.push(["email","mailto:"+d.email.trim(),d.email]);
  if(d.tel)rows.push(["tel","tel:"+telClean(d.tel),d.tel]);
  if(d.web){var w=normUrl(d.web);rows.push(["web",w,shortUrl(w)])}
  if(d.linkedin){var l=normLinkedin(d.linkedin);rows.push(["linkedin",l,"LinkedIn"])}
  if(d.instagram)rows.push(["instagram",normInstagram(d.instagram),"Instagram"]);
  if(d.adresse)rows.push(["adresse",mapsUrl(d.adresse),d.adresse]);
  var R=$("rows");R.innerHTML="";
  rows.forEach(function(r){
    var a=document.createElement("a");a.className="row";a.href=r[1];
    if(/^https?:/.test(r[1])){a.target="_blank";a.rel="noopener"}
    a.innerHTML=ICONS[r[0]]+'<span>'+esc(r[2])+'</span>';R.appendChild(a);
  });
  if(!rows.length){R.innerHTML='<p class="empty">Aucune coordonnée renseignée. Touchez « Modifier ».</p>'}
  var bn=$("banner");
  bn.hidden=true;
  $("editBtn").hidden=visitor;$("qrBtn").hidden=visitor;$("createLink").hidden=!visitor;
  document.title=(fullName(d)||"Carte")+(d.entreprise?" – "+d.entreprise:"");
}

/* ---------- vCard 3.0 ---------- */
function vEsc(s){return String(s).replace(/\\/g,"\\\\").replace(/\r?\n/g,"\\n").replace(/;/g,"\\;").replace(/,/g,"\\,")}
function fold(line){var out=[],max=75;while(line.length>max){out.push(line.slice(0,max));line=" "+line.slice(max);max=75}out.push(line);return out.join("\r\n")}
function buildVcard(d,withPhoto){
  var L=["BEGIN:VCARD","VERSION:3.0"];
  L.push("N:"+vEsc(d.nom)+";"+vEsc(d.prenom)+";;;");
  L.push("FN:"+vEsc(fullName(d)||d.entreprise||"Contact"));
  if(d.entreprise)L.push("ORG:"+vEsc(d.entreprise));
  if(d.poste)L.push("TITLE:"+vEsc(d.poste));
  if(d.email)L.push("EMAIL;TYPE=INTERNET,WORK:"+d.email.trim());
  if(d.tel)L.push("TEL;TYPE=CELL,VOICE:"+telClean(d.tel));
  if(d.web)L.push("URL;TYPE=WORK:"+normUrl(d.web));
  if(d.linkedin){L.push("item1.URL:"+normLinkedin(d.linkedin));L.push("item1.X-ABLabel:LinkedIn")}
  if(d.instagram){L.push("item2.URL:"+normInstagram(d.instagram));L.push("item2.X-ABLabel:Instagram")}
  if(d.adresse)L.push("ADR;TYPE=WORK:;;"+vEsc(d.adresse)+";;;;");
  if(d.slogan)L.push("NOTE:"+vEsc(d.slogan));
  if(withPhoto&&d.photo){var m=/^data:image\/(\w+);base64,(.+)$/.exec(d.photo);if(m)L.push("PHOTO;ENCODING=b;TYPE="+m[1].toUpperCase().replace("JPG","JPEG")+":"+m[2])}
  L.push("END:VCARD");
  return L.map(fold).join("\r\n")+"\r\n";
}
function downloadVcf(){
  var txt=buildVcard(data,true);
  var blob=new Blob([txt],{type:"text/vcard;charset=utf-8"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download=(fbase(fullName(data)||"contact").replace(/[^\w\-]+/g,"_"))+".vcf";
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
  toast("Contact téléchargé");
}
window.__buildVcard=buildVcard;

/* ---------- QR ---------- */
function makeQr(text){
  var levels=["M","L"];
  for(var i=0;i<levels.length;i++){try{var q=qrcode(0,levels[i]);q.addData(text);q.make();return q}catch(e){}}
  return null;
}
function renderQr(cv,qr,target,msg){
  var ctx=cv.getContext("2d");
  if(!qr){cv.width=cv.height=target;ctx.fillStyle="#fff";ctx.fillRect(0,0,target,target);ctx.fillStyle="#b4281e";ctx.font="bold "+Math.round(target/22)+"px sans-serif";ctx.textAlign="center";
    (msg||"QR indisponible").split("\n").forEach(function(l,i){ctx.fillText(l,target/2,target/2+i*target/18)});return}
  var n=qr.getModuleCount(),quiet=4,scale=Math.max(1,Math.round(target/(n+quiet*2)));
  var size=(n+quiet*2)*scale;cv.width=cv.height=size;
  ctx.fillStyle="#fff";ctx.fillRect(0,0,size,size);ctx.fillStyle="#111";
  for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(qr.isDark(r,c))ctx.fillRect((c+quiet)*scale,(r+quiet)*scale,scale,scale);
}
function qrText(){
  if(qrMode==="v")return{text:buildVcard(data,false)};
  var u=cardUrl(false);
  return u?{text:u}:{text:"",msg:"Adresse publique non renseignée\n(Modifier > Adresse publique)"};
}
function showQr(){
  var q=qrText(),qr=q.text?makeQr(q.text):null;
  renderQr($("qr"),qr,600,q.text?"Trop de données pour un QR\n(raccourcissez les textes)":q.msg);
  $("segV").classList.toggle("on",qrMode==="v");$("segU").classList.toggle("on",qrMode==="u");
  $("qrDl").disabled=!qr;$("qrDl").style.opacity=qr?1:.5;
  $("qrHint").textContent=!qr?(q.text?"":"Renseignez l'adresse où vous hébergerez ce fichier pour activer le QR « lien ».")
    :qrMode==="v"?"Contact direct : scannez, le contact s'ajoute dans le téléphone (sans photo)."
    :"Les prospects scannent pour ouvrir votre carte"+(/^https:/i.test(baseUrl())?".":" (attention : l'adresse n'est pas en HTTPS).");
}
function downloadQr(){
  var q=qrText();if(!q.text)return;var qr=makeQr(q.text);if(!qr)return;
  var cv=document.createElement("canvas");renderQr(cv,qr,1200);
  var name="QR_"+(qrMode==="u"?"carte":"contact")+"_"+(fbase(fullName(data)||"carte").replace(/[^\w\-]+/g,"_"))+".png";
  function save(href){var a=document.createElement("a");a.href=href;a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){a.remove();if(href.indexOf("blob:")===0)URL.revokeObjectURL(href)},1500);toast("QR téléchargé")}
  if(cv.toBlob)cv.toBlob(function(b){b?save(URL.createObjectURL(b)):save(cv.toDataURL("image/png"))},"image/png");else save(cv.toDataURL("image/png"));
}

/* ---------- partage ---------- */
function copyText(t){
  if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t);
  return new Promise(function(res,rej){var ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy")?res():rej()}catch(e){rej(e)}ta.remove()});
}
function shareFile(){
  var txt=buildVcard(data,true),name=fbase(fullName(data)||"contact").replace(/[^\w\-]+/g,"_")+".vcf";
  try{var f=new File([txt],name,{type:"text/vcard"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){return navigator.share({files:[f],title:fullName(data)}).catch(function(e){if(e&&e.name!=="AbortError")downloadVcf()})}}catch(e){}
  downloadVcf();
}
function share(){
  var url=visitor?location.href:cardUrl(true);
  if(!url)return shareFile();
  var title=fullName(data)+(data.entreprise?" – "+data.entreprise:"");
  var fallback=function(){copyText(url).then(function(){toast("Lien copié")},function(){window.prompt("Copiez ce lien :",url)})};
  if(navigator.share){navigator.share({title:title,text:"Carte de visite de "+fullName(data),url:url}).catch(function(e){if(e&&e.name!=="AbortError")fallback()})}
  else fallback();
}

/* ---------- édition ---------- */
function resizeImg(file,max,q){
  return new Promise(function(res,rej){
    var fr=new FileReader();fr.onerror=rej;
    fr.onload=function(){var im=new Image();im.onerror=rej;im.onload=function(){
      var s=Math.min(im.width,im.height),sx=(im.width-s)/2,sy=(im.height-s)/2,o=Math.min(max,s);
      var cv=document.createElement("canvas");cv.width=cv.height=o;var cx=cv.getContext("2d");
      cx.fillStyle="#fff";cx.fillRect(0,0,o,o);cx.drawImage(im,sx,sy,s,s,0,0,o,o);res(cv.toDataURL("image/jpeg",q))};im.src=fr.result};
    fr.readAsDataURL(file)});
}
function buildColors(){
  var box=$("colors");box.innerHTML="";
  COLORS.forEach(function(c){var b=document.createElement("button");b.type="button";b.className="sw"+(draft.accent.toLowerCase()===c?" on":"");b.style.background=c;b.setAttribute("aria-label","Couleur "+c);b.onclick=function(){setAccent(c)};box.appendChild(b)});
  var inp=document.createElement("input");inp.type="color";inp.value=/^#[0-9a-f]{6}$/i.test(draft.accent)?draft.accent:"#8b5cf6";inp.setAttribute("aria-label","Couleur personnalisée");
  inp.oninput=function(){setAccent(inp.value,true)};box.appendChild(inp);
}
function setAccent(c,keepPicker){draft.accent=c;applyAccent(c);if(!keepPicker)buildColors();else[].forEach.call(document.querySelectorAll(".sw"),function(s){s.classList.remove("on")})}
function photoPreview(){var p=$("photoPrev");p.innerHTML="";p.textContent="";if(draft.photo||draft.thumb)avatarHtml(draft,p);else p.textContent=initials(draft);$("photoDel").hidden=!(draft.photo||draft.thumb);$("photoDl").hidden=!draft.photo}
function openEdit(){
  draft=clone(data);
  FIELDS.forEach(function(k){$("f_"+k).value=draft[k]});
  buildColors();photoPreview();
  $("cardView").hidden=true;$("editView").hidden=false;window.scrollTo(0,0);
}
function closeEdit(save){
  if(save){FIELDS.forEach(function(k){draft[k]=$("f_"+k).value.trim()});if(draft.publicUrl)draft.publicUrl=normUrl(draft.publicUrl.replace(/#.*$/,""));data=draft;saveLocal(data)}
  draft=null;if(/^#(new|edit)$/.test(location.hash)){try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}}applyAccent(data.accent);renderCard();
  $("editView").hidden=true;$("cardView").hidden=false;window.scrollTo(0,0);
  if(save)toast("Carte enregistrée");
}
$("photoBtn").onclick=function(){$("photoFile").click()};
$("photoFile").onchange=function(){
  var f=this.files[0];if(!f)return;
  Promise.all([resizeImg(f,320,.85),resizeImg(f,128,.65)]).then(function(r){draft.photo=r[0];draft.thumb=r[1];photoPreview()},function(){toast("Image illisible")});
  this.value="";
};
$("photoDl").onclick=function(){if(!draft.photo)return;var a=document.createElement("a");a.href=draft.photo;a.download="photo.jpg";document.body.appendChild(a);a.click();a.remove()};
$("photoDel").onclick=function(){draft.photo="";draft.thumb="";photoPreview()};
FIELDS.forEach(function(k){$("f_"+k).addEventListener("input",function(){if(k==="prenom"||k==="nom"){draft.prenom=$("f_prenom").value;draft.nom=$("f_nom").value;if(!draft.photo&&!draft.thumb)photoPreview()}})});
$("saveBtn").onclick=function(){closeEdit(true)};
$("cancelBtn").onclick=function(){closeEdit(false)};
$("editBtn").onclick=openEdit;
$("resetBtn").onclick=function(){if(confirm("Rétablir la carte par défaut ?")){draft=clone(DEFAULT);FIELDS.forEach(function(k){$("f_"+k).value=draft[k]});buildColors();photoPreview();applyAccent(draft.accent)}};
$("addBtn").onclick=downloadVcf;
$("shareBtn").onclick=share;
$("qrBtn").onclick=function(){qrMode=baseUrl()?"u":"v";$("sheetBg").hidden=false;showQr()};
$("qrDl").onclick=downloadQr;
$("segV").onclick=function(){qrMode="v";showQr()};
$("segU").onclick=function(){qrMode="u";showQr()};
$("qrClose").onclick=function(){$("sheetBg").hidden=true};
$("sheetBg").onclick=function(e){if(e.target===this)this.hidden=true};

/* ---------- démarrage ---------- */
function init(){
  var h=location.hash,fromHash=readHash(),local=readLocal();
  $("editView").hidden=true;$("sheetBg").hidden=true;
  if(fromHash){visitor=true;data=fromHash}                       // lien partagé : lecture seule
  else if(h==="#new"){visitor=false;data=merge({});FIELDS.forEach(function(k){data[k]=""});data.accent=DEFAULT.accent;renderCard();$("cardView").hidden=false;openEdit();return}
  else if(h==="#edit"||local||!/^https?:$/.test(location.protocol)){visitor=false;data=local||clone(DEFAULT);if(!local)saveLocal(data)}
  else{visitor=true;data=clone(DEFAULT)}                          // page hébergée sans données locales : lecture seule
  renderCard();$("cardView").hidden=false;
}
init();
window.addEventListener("hashchange",function(){if(!draft)init()});
})();
</script>
